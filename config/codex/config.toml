# MCP servers for Codex CLI; merge into ~/.codex/config.toml. Secrets come from env vars only.
web_search = "live"

[mcp_servers.atlassian]
url = "https://mcp.atlassian.com/v2/mcp"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT"

[mcp_servers.aws-docs]
command = "uvx"
args = ["awslabs.aws-documentation-mcp-server@latest"]

[mcp_servers.aws-docs.env]
AWS_DOCUMENTATION_PARTITION = "aws"
FASTMCP_LOG_LEVEL = "ERROR"

[mcp_servers.eks]
command = "uvx"
args = ["awslabs.eks-mcp-server@latest"]
env_vars = ["AWS_PROFILE", "AWS_REGION"]

[mcp_servers.eks.env]
FASTMCP_LOG_LEVEL = "ERROR"

[mcp_servers.aws-cost]
command = "uvx"
args = ["awslabs.billing-cost-management-mcp-server@latest"]
env_vars = ["AWS_PROFILE", "AWS_REGION"]

[mcp_servers.aws-cost.env]
FASTMCP_LOG_LEVEL = "ERROR"

[mcp_servers.kubernetes]
command = "npx"
# Codex does not expand ~ or $HOME here; use your absolute path
args = ["-y", "kubernetes-mcp-server@latest", "--config", "/Users/<you>/.config/kubernetes-mcp-server/config.toml"]
startup_timeout_sec = 60.0

[mcp_servers.terraform]
command = "docker"
args = ["run", "-i", "--rm", "hashicorp/terraform-mcp-server:0.4.0"]

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.fetch]
command = "uvx"
args = ["mcp-server-fetch"]

[mcp_servers.grafana]
command = "uvx"
args = ["mcp-grafana@latest", "--disable-write"]
env_vars = ["GRAFANA_URL", "GRAFANA_SERVICE_ACCOUNT_TOKEN"]

[mcp_servers.sonarqube]
command = "docker"
args = ["run", "--init", "-i", "--rm", "-e", "SONARQUBE_TOKEN", "-e", "SONARQUBE_URL", "-e", "SONARQUBE_READ_ONLY", "sonarsource/sonarqube-mcp:1.29.0.4488"]
env_vars = ["SONARQUBE_TOKEN", "SONARQUBE_URL"]

[mcp_servers.sonarqube.env]
SONARQUBE_READ_ONLY = "true"
