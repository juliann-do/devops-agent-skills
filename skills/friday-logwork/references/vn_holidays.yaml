# Vietnam public holidays, by year. Seed/best-effort list — NOT guaranteed
# authoritative. Fixed (solar-date) holidays are reliable; lunar-calendar
# holidays (Tet, Hung Kings) shift every year and their exact multi-day
# "bridge" schedule is only confirmed by an official government
# announcement (usually issued a few months ahead by MOLISA). Entries
# marked `verify: true` should be re-checked (WebSearch "Vietnam public
# holidays <year> official government announcement") before being trusted
# for a date range the skill is about to act on.
#
# Add new years at the bottom as they're confirmed. Never delete past
# years — they're harmless history and useful as a format reference.

2026:
